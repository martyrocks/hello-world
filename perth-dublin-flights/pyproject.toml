[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perth-dublin-flight-finder"
version = "1.0.0"
description = "Find the cheapest flights from Perth (PER) to Dublin (DUB)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flightfinder = "flightfinder.cli:main"

[tool.setuptools.packages.find]
include = ["flightfinder*"]

[tool.setuptools.package-data]
flightfinder = ["static/*.html"]
